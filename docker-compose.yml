version: "2.2"
# ipv6 is not supported in version 3

services:
  imc_deps:
    scale: 0
    image: faust.cs.fau.de:5000/imc_deps
    build:
      context: imc
      dockerfile: Dockerfile.deps
  imc:
    restart: unless-stopped
    image: faust.cs.fau.de:5000/imc
    build:
      context: imc/
      dockerfile: Dockerfile
    volumes:
       - imc_db:/imc/data
    ports:
      - "8080:8080/tcp"

volumes:
  imc_db:

networks:
  default:
    enable_ipv6: true
    ipam:
        driver: default
        config:
            - subnet: "fd42:d0ce:4444::/64"
